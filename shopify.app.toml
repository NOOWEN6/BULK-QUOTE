# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "258db1e1b2e23745ddcce9d05ecf2a63"
name = "BulkQuote"
application_url = "https://bulk-quote-j7t3.onrender.com"
embedded = true

[access_scopes]
scopes = "write_discounts,read_products,write_products"

[app_proxy]
url = "https://bulk-quote-j7t3.onrender.com/proxy/quote-request"
subpath = "quote-request"
prefix = "apps"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[webhooks.privacy_compliance]
customer_deletion_url = "https://bulk-quote-j7t3.onrender.com/webhooks/customers/redact"
customer_data_request_url = "https://bulk-quote-j7t3.onrender.com/webhooks/customers/data_request"
shop_deletion_url = "https://bulk-quote-j7t3.onrender.com/webhooks/shop/redact"

[auth]
redirect_urls = [
  "https://bulk-quote-j7t3.onrender.com/auth/callback",
  "https://bulk-quote-j7t3.onrender.com/auth/shopify/callback",
  "https://bulk-quote-j7t3.onrender.com/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = false