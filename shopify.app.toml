# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "258db1e1b2e23745ddcce9d05ecf2a63"
name = "BulkQuote"
application_url = "https://bulk-quote.onrender.com"
embedded = true

[access_scopes]
scopes = "write_discounts,read_products,write_products"

[app_proxy]
url = "https://example.com/proxy/quote-request"
subpath = "apps"
prefix = "apps"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[webhooks.privacy_compliance]
customer_deletion_url = "https://bulk-quote.onrender.com/webhooks/customers/redact"
customer_data_request_url = "https://bulk-quote.onrender.com/webhooks/customers/data_request"
shop_deletion_url = "https://bulk-quote.onrender.com/webhooks/shop/redact"

[auth]
redirect_urls = [
  "https://bulk-quote.onrender.com/auth/callback",
  "https://bulk-quote.onrender.com/auth/shopify/callback",
  "https://bulk-quote.onrender.com/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true